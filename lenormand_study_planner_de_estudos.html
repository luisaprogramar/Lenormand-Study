    // 10 Categorias obrigatórias para a ficha individual de cada uma das 36 cartas

      { id: 2, code: "MÓDULO 2", title: "Simbologia", subtitle: "Leitura simbólica de fauna, flora, objetos, elementos, cores e mitos." },

    // Construção determinística e pedagógica do Cronograma Completo (~138 dias detalhados)
    function buildCurriculumDays() {
      const days = [];
      let dayCounter = 1;

      const pushDay = (moduleId, theme, minutes, topics, cardRef = null) => {
        days.push({
          day: dayCounter++,
          moduleId,
          theme,
          estimatedMinutes: minutes,
          cardRef,
          tasks: topics.map((t, idx) => ({
            id: `d${dayCounter - 1}_t${idx + 1}`,
            text: t
          }))
        });
      };

      // --- MÓDULO 1: História e fundamentos (4 dias) ---

        "História do Petit Lenormand (Das Spiel der Hoffnung, 1799)",
        "Origem do Baralho Cigano e evolução iconográfica",
        "Biografia e legado histórico de Marie Anne Lenormand"
      ]);
      pushDay(1, "Arquitetura do Baralho e Escolas", 60, [
        "Estrutura das 36 cartas e organização numérica",
        "Diferenças entre escolas (Europeia/Alemã, Francesa, Brasileira)",
        "Baralho Cigano no Brasil: sincretismo e consolidação cultural"
      ]);

        "Cartomancia tradicional e inserção dos naipes",
        "História das práticas divinatórias e oraculares"
      ]);
      pushDay(1, "Bases Epistemológicas e Ética Oracular", 60, [
        "Fundamentos da interpretação simbólica",
        "Equilíbrio entre intuição e conhecimento técnico",
        "Ética na cartomancia e limites da consulta"
      ]);

      // --- MÓDULO 2: Simbologia (4 dias) ---

        "Simbologia dos animais no repertório oracular",
        "Simbologia das plantas, árvores e flores",
        "Simbologia dos elementos naturais (Terra, Água, Fogo, Ar)"
      ]);
      pushDay(2, "Simbologia Material e Arquitetônica", 60, [
        "Simbologia dos objetos cotidianos e instrumentos",
        "Simbologia das construções e espaços delimitados"
      ]);
      pushDay(2, "Fenômenos, Cores e Dinâmica Visual", 60, [
        "Simbologia dos fenômenos naturais e climáticos",
        "Simbologia das cores nas lâminas tradicionais",
        "Simbologia dos movimentos, direções e vetores na imagem"
      ]);
      pushDay(2, "Números, Mitos e Tradições Culturais", 60, [
        "Simbologia dos números na leitura visual",
        "Simbologia mitológica clássica",
        "Simbologia cultural e religiosa"
      ]);

      // --- MÓDULO 3: Numerologia e correspondências (4 dias) ---
      pushDay(3, "Fundamentos Numéricos das 36 Cartas", 60, [
        "Numerologia das 36 cartas (1 a 36 e reduções)",
        "Polaridade entre números pares e ímpares",
        "Sequências numéricas e progressões na leitura"
      ]);
      pushDay(3, "Cartomancia Clássica: Naipes e Elementos", 60, [
        "Naipes tradicionais (Copas, Ouros, Espadas, Paus) e figuras da corte",
        "Correspondência com os quatro elementos"
      ]);
      pushDay(3, "Correspondências Astrológicas e Temporais", 60, [
        "Astrologia aplicada ao Petit Lenormand",
        "Signos zodiacais associados às lâminas",
        "Planetas regentes",
        "Dias da semana, meses e estações do ano"
      ]);
      pushDay(3, "Sistemas Esotéricos e Comparativo de Escolas", 60, [
        "Correspondências esotéricas tradicionais",
        "Comparação estrutural de correspondências entre diferentes escolas"
      ]);

      // --- MÓDULO 4: Estudo aprofundado das 36 cartas (3 dias por carta = 108 dias) ---

        // Dia 1 da carta: Identidade, Psicologia, Aparência

    function getTodayISO() {

      const local = new Date(now.getTime() - (offset * 60 * 1000));
      return local.toISOString().split('T')[0];
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return structuredClone(defaultState);
        const parsed = JSON.parse(raw);
        return {
          ...structuredClone(defaultState),
          ...parsed,
          settings: { ...defaultState.settings, ...(parsed.settings || {}) },
          revisionChecks: { ...defaultState.revisionChecks, ...(parsed.revisionChecks || {}) }
        };
      } catch (e) {
        console.error("Erro ao carregar localStorage:", e);
        return structuredClone(defaultState);
      }
    }

      }

    // ----------------------------------------------------------------------------
    // 3. UTILITÁRIOS DE DATA, CÁLCULO DE PROGRESSO E FORMATAÇÃO
    // ----------------------------------------------------------------------------

    function addDaysToISO(isoDate, daysToAdd) {
      if (!isoDate) return null;
      const [y, m, d] = isoDate.split('-').map(Number);
      const date = new Date(y, m - 1, d);
      date.setDate(date.getDate() + daysToAdd);
      const yy = date.getFullYear();
      const mm = String(date.getMonth() + 1).padStart(2, '0');
      const dd = String(date.getDate()).padStart(2, '0');
      return `${yy}-${mm}-${dd}`;
    }

    function formatDateBR(isoDate) {
      if (!isoDate) return "Sem data";
      const [y, m, d] = isoDate.split('-');
      return `${d}/${m}/${y}`;
    }

    function formatFullDateBR() {
      const now = new Date();
      return now.toLocaleDateString('pt-BR', {
        weekday: 'long',
        day: 'numeric',
        month: 'long',
        year: 'numeric'
      });
    }

    function getDayData(dayNum) {
      const base = CURRICULUM_DAYS.find(d => d.day === dayNum);
      if (!base) return null;
      const prog = state.daysProgress[dayNum] || {
        status: 'not_started',
        completedAt: null,
        notes: '',
        customTasks: [],
        checkedTasks: {}
      };
      const allTasks = [...base.tasks, ...(prog.customTasks || [])];
      const scheduledDate = state.settings.startDate
        ? addDaysToISO(state.settings.startDate, dayNum - 1)
        : null;

      return {
        ...base,
        ...prog,
        allTasks,
        scheduledDate
      };
    }

    function getNextPendingDay() {
      for (const d of CURRICULUM_DAYS) {
        const prog = state.daysProgress[d.day];
        if (!prog || prog.status !== 'completed') {
          return getDayData(d.day);
        }
      }
      return getDayData(CURRICULUM_DAYS[CURRICULUM_DAYS.length - 1].day);
    }

    function getLastStudiedDay() {
      let lastDay = 1;
      for (const d of CURRICULUM_DAYS) {
        const prog = state.daysProgress[d.day];
        if (prog && (prog.status === 'in_progress' || prog.status === 'completed')) {
          lastDay = d.day;
        }
      }
      return lastDay;
    }

    function getTotalCardTopicsCount() {
      return CARD_STUDY_CATEGORIES.reduce((acc, cat) => acc + cat.topics.length, 0); // 116 tópicos por carta
    }

    function getCardProgress(cardNum) {
      const total = getTotalCardTopicsCount();
      const prog = state.cardsProgress[cardNum] || { checkedTopics: {}, notes: '', customImage: '' };
      const checkedCount = Object.values(prog.checkedTopics || {}).filter(Boolean).length;
      const percent = Math.round((checkedCount / total) * 100);
      let status = 'Não iniciada';
      if (checkedCount > 0 && checkedCount < total) status = 'Em estudo';
      if (checkedCount >= total) status = 'Concluída';
      return {
        checkedCount,
        total,
        percent,
        status,
        notes: prog.notes || '',
        customImage: prog.customImage || '',
        checkedTopics: prog.checkedTopics || {}
      };
    }

    function getModuleProgress(moduleId) {
      const modDays = CURRICULUM_DAYS.filter(d => d.moduleId === moduleId);
      const completed = modDays.filter(d => state.daysProgress[d.day]?.status === 'completed').length;
      const percent = modDays.length ? Math.round((completed / modDays.length) * 100) : 0;
      return { completed, total: modDays.length, percent };
    }

    function calculateStreak() {
      const dates = [...new Set(state.activityDates)].sort().reverse();
      if (dates.length === 0) return 0;

      const today = getTodayISO();
      const yesterday = addDaysToISO(today, -1);

      if (dates[0] !== today && dates[0] !== yesterday) {
        return 0;
      }

      let streak = 1;
      let cursor = dates[0];
      for (let i = 1; i < dates.length; i++) {
        const expectedPrev = addDaysToISO(cursor, -1);
        if (dates[i] === expectedPrev) {
          streak++;
          cursor = dates[i];
        } else {
          break;
        }
      }
      return streak;
    }

    function getGlobalStats() {
      const totalDays = CURRICULUM_DAYS.length;
      let completedDays = 0;
      let studiedMinutes = 0;

      CURRICULUM_DAYS.forEach(d => {
        const prog = state.daysProgress[d.day];
        if (prog?.status === 'completed') {
          completedDays++;
          studiedMinutes += (state.settings.dailyMinutes || d.estimatedMinutes);
        } else if (prog?.status === 'in_progress') {
          const checked = Object.values(prog.checkedTasks || {}).filter(Boolean).length;
          if (checked > 0) {
            studiedMinutes += Math.round((d.estimatedMinutes * checked) / d.tasks.length);
          }
        }
      });

      const remainingDays = totalDays - completedDays;
      const overallPercent = Math.round((completedDays / totalDays) * 100);
      const streak = calculateStreak();
      const studiedHours = (studiedMinutes / 60).toFixed(1);

      // Combinações concluídas
      const completedCombos = Object.values(state.combinationsProgress || {}).filter(c => c.completed).length;

      return {
        totalDays,
        completedDays,
        remainingDays,
        overallPercent,
        streak,
        studiedHours,
        completedCombos
      };
    }

    // ----------------------------------------------------------------------------

    function toggleDayTask(dayNum, taskId) {
      const day = getDayData(dayNum);
      if (!day) return;

      if (!state.daysProgress[dayNum]) {
        state.daysProgress[dayNum] = {
          status: 'in_progress',
          completedAt: null,
          notes: '',
          customTasks: [],
          checkedTasks: {}
        };
      }

      const prog = state.daysProgress[dayNum];
      prog.checkedTasks[taskId] = !prog.checkedTasks[taskId];

      const totalTasks = day.allTasks.length;
      const checkedCount = day.allTasks.filter(t => prog.checkedTasks[t.id]).length;

      if (checkedCount === 0) {
        prog.status = 'not_started';
        prog.completedAt = null;
      } else if (checkedCount === totalTasks) {
        prog.status = 'completed';
        prog.completedAt = prog.completedAt || getTodayISO();
        recordActivityToday();
      } else {
        prog.status = 'in_progress';
        prog.completedAt = null;
        recordActivityToday();
      }

      saveState();
      renderCurrentView();
    }

    function markDayCompleted(dayNum) {
      const day = getDayData(dayNum);
      if (!day) return;

      if (!state.daysProgress[dayNum]) {
        state.daysProgress[dayNum] = {
          status: 'completed',
          completedAt: getTodayISO(),
          notes: '',
          customTasks: [],
          checkedTasks: {}
        };
      }

      const prog = state.daysProgress[dayNum];
      const wasCompleted = prog.status === 'completed';

      if (wasCompleted) {
        prog.status = 'not_started';
        prog.completedAt = null;
        prog.checkedTasks = {};
        showToast(`Dia ${dayNum} reaberto como pendente.`);
      } else {
        prog.status = 'completed';
        prog.completedAt = getTodayISO();
        day.allTasks.forEach(t => {
          prog.checkedTasks[t.id] = true;
        });
        recordActivityToday();
        showToast(`Dia ${dayNum} concluído com sucesso! ✦`);
      }

      saveState();
      renderCurrentView();
    }

    function addCustomTaskToDay(dayNum, taskText) {
      const trimmed = taskText.trim();

      if (!state.daysProgress[dayNum]) {

          status: 'not_started',
          completedAt: null,

      if (!state.cardsProgress[cardNum]) {

      }

    function getComboKey(a, b) {
      const min = Math.min(a, b);
      const max = Math.max(a, b);
      return `${min}-${max}`;
    }

    function toggleComboTopic(a, b, topicIdx) {
      if (a === b) return;
      const key = getComboKey(a, b);
      if (!state.combinationsProgress[key]) {

      cp.checkedTopics[topicIdx] = !cp.checkedTopics[topicIdx];

      cp.completed = count === COMBINATION_TOPICS.length;
      recordActivityToday();
      saveState();
      renderCurrentView();

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const el = document.createElement('div');
      el.className = `pointer-events-auto px-4 py-3 rounded-2xl shadow-lg border text-sm font-medium flex items-center gap-2.5 fade-in ${
        type === 'warning'
          ? 'bg-roseLight border-roseDark text-roseDark'
          : 'bg-roseWhite border-roseMedium text-inkText'
      }`;
      el.innerHTML = `
        <span class="w-2.5 h-2.5 rounded-full bg-roseDark shrink-0"></span>
        <span>${message}</span>
      `;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transition = 'opacity 0.3s ease';
        setTimeout(() => el.remove(), 300);
      }, 3200);
    }

    function navigateTo(route, opts = {}) {
      currentRoute = route;

      document.getElementById('sidebar').classList.add('-translate-x-full');
      document.getElementById('mobile-backdrop').classList.add('hidden');

      renderNavigation();
      renderCurrentView();

    function renderCurrentView() {
      const container = document.getElementById('view-container');
      container.classList.remove('fade-in');

      container.classList.add('fade-in');

      switch (currentRoute) {
        case 'dashboard':
          container.innerHTML = renderDashboardView();
          break;
        case 'schedule':
          container.innerHTML = renderScheduleView();

        case 'modules':
          container.innerHTML = renderModulesView();

          break;

    function renderMonthlyCalendarWidget() {
      const year = calendarViewDate.getFullYear();
      const month = calendarViewDate.getMonth();
      const monthName = calendarViewDate.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });

      const firstDayWeek = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const todayISO = getTodayISO();

      // Mapear datas em que dias do cronograma foram concluídos ou estão agendados
      const completedDatesSet = new Set(state.activityDates);
      Object.values(state.daysProgress).forEach(p => {
        if (p.completedAt) completedDatesSet.add(p.completedAt);
      });

      const scheduledMap = {};
      if (state.settings.startDate) {
        CURRICULUM_DAYS.forEach(d => {
          const dt = addDaysToISO(state.settings.startDate, d.day - 1);
          scheduledMap[dt] = d.day;
        });
      }

      let cells = '';
      for (let i = 0; i < firstDayWeek; i++) {
        cells += `<div class="h-10"></div>`;
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const iso = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const isCompleted = completedDatesSet.has(iso);
        const isToday = iso === todayISO;
        const scheduledDayNum = scheduledMap[iso];

        cells += `
          <button
            ${scheduledDayNum ? `onclick="navigateTo('schedule', { dayNum: ${scheduledDayNum} })"` : ''}
            title="${scheduledDayNum ? `Dia ${scheduledDayNum} do cronograma` : formatDateBR(iso)}"
            class="h-10 rounded-xl text-xs font-medium flex flex-col items-center justify-center relative transition ${
              isCompleted
                ? 'bg-roseDark text-roseWhite font-semibold shadow-xs'
                : isToday
                  ? 'bg-rosePastel text-roseDark border border-roseDark font-bold'
                  : scheduledDayNum
                    ? 'bg-roseLight/60 text-inkText hover:bg-rosePastel/70'
                    : 'text-inkText/70 hover:bg-roseLight/40'
            }"
          >
            <span>${day}</span>
            ${scheduledDayNum && !isCompleted ? `<span class="w-1 h-1 rounded-full bg-roseAntique mt-0.5"></span>` : ''}
          </button>
        `;
      }

      return `
        <div>
          <div class="flex items-center justify-between mb-4">
            <div>
              <h3 class="text-2xl font-bold text-roseDark capitalize">${monthName}</h3>
              <p class="text-xs text-inkText/70">Dias estudados e agenda prevista</p>
            </div>
            <div class="flex items-center gap-1.5">
              <button onclick="changeCalendarMonth(-1)" class="p-2 rounded-xl bg-roseLight text-roseDark hover:bg-rosePastel transition">
                <i data-lucide="chevron-left" class="w-4 h-4"></i>
              </button>
              <button onclick="changeCalendarMonth(1)" class="p-2 rounded-xl bg-roseLight text-roseDark hover:bg-rosePastel transition">
                <i data-lucide="chevron-right" class="w-4 h-4"></i>
              </button>
            </div>
          </div>

          <div class="grid grid-cols-7 gap-1.5 text-center text-[11px] font-semibold text-roseAntique uppercase mb-2">
            <div>Dom</div><div>Seg</div><div>Ter</div><div>Qua</div><div>Qui</div><div>Sex</div><div>Sáb</div>
          </div>
          <div class="grid grid-cols-7 gap-1.5">
            ${cells}
          </div>

          <div class="mt-4 pt-3 border-t border-roseLight flex flex-wrap items-center gap-4 text-[11px] text-inkText/75">
            <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-sm bg-roseDark inline-block"></span> Estudo realizado</span>
            <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-sm bg-rosePastel border border-roseDark inline-block"></span> Hoje</span>
            <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-sm bg-roseLight inline-block"></span> Dia programado</span>
          </div>
        </div>
      `;
    }

    function changeCalendarMonth(delta) {
      calendarViewDate = new Date(calendarViewDate.getFullYear(), calendarViewDate.getMonth() + delta, 1);
      renderCurrentView();
    }

    function handleAddGoal(e) {
      e.preventDefault();
      const input = document.getElementById('new-goal-input');
      const text = input.value.trim();
      if (!text) return;
      state.personalGoals.unshift({ id: `goal_${Date.now()}`, text, done: false });
      saveState();
      renderCurrentView();
    }

    function togglePersonalGoal(id) {
      const g = state.personalGoals.find(x => x.id === id);
      if (g) {
        g.done = !g.done;
        saveState();
        renderCurrentView();
      }
    }

    function deletePersonalGoal(id) {
      state.personalGoals = state.personalGoals.filter(x => x.id !== id);
      saveState();
      renderCurrentView();
    }

    // ----------------------------------------------------------------------------
    // PÁGINA 2: CRONOGRAMA DIÁRIO
    // ----------------------------------------------------------------------------

    function renderScheduleView() {
      const filteredDays = CURRICULUM_DAYS.map(d => getDayData(d.day)).filter(day => {
        if (scheduleFilterModule !== 'all' && String(day.moduleId) !== scheduleFilterModule) return false;
        if (scheduleFilterStatus === 'pending' && day.status === 'completed') return false;
        if (scheduleFilterStatus === 'completed' && day.status !== 'completed') return false;
        if (scheduleSearchQuery.trim() !== '') {
          const q = scheduleSearchQuery.toLowerCase();
          const inTheme = day.theme.toLowerCase().includes(q);
          const inTasks = day.allTasks.some(t => t.text.toLowerCase().includes(q));
          const inDayNum = `dia ${day.day}`.includes(q);
          if (!inTheme && !inTasks && !inDayNum) return false;
        }
        return true;
      });

      // Garantir que há um dia focado válido
      if (!selectedScheduleDay || !filteredDays.some(d => d.day === selectedScheduleDay)) {
        selectedScheduleDay = filteredDays.length > 0 ? filteredDays[0].day : null;
      }

      const activeDay = selectedScheduleDay ? getDayData(selectedScheduleDay) : null;
      const activeMod = activeDay ? MODULES_META.find(m => m.id === activeDay.moduleId) : null;
      const currentIndexInFiltered = filteredDays.findIndex(d => d.day === selectedScheduleDay);

      return `
        <div class="space-y-6">
          <!-- Cabeçalho -->
          <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
              <span class="text-xs uppercase tracking-[0.2em] text-roseAntique font-semibold">Currículo Estruturado</span>
              <h2 class="text-3xl sm:text-4xl font-bold text-roseDark">Cronograma Diário</h2>
              <p class="text-sm text-inkText/75 mt-0.5">
                ${CURRICULUM_DAYS.length} dias sequenciais organizados por pré-requisitos pedagógicos.
              </p>
            </div>

            <button
              onclick="resumeLastStudiedDay()"
              class="self-start md:self-auto px-4 py-2.5 rounded-xl bg-roseDark text-roseWhite text-sm font-semibold shadow-sm hover:opacity-95 transition flex items-center gap-2"
            >
              <i data-lucide="compass" class="w-4 h-4"></i>
              Retomar último dia estudado
            </button>
          </div>

          <!-- Barra de Filtros e Pesquisa -->
          <div class="card-surface rounded-2xl p-4 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-12 gap-3">
            <div class="lg:col-span-5 relative">
              <i data-lucide="search" class="w-4 h-4 text-roseAntique absolute left-3.5 top-3.5"></i>
              <input
                type="text"
                value="${escapeHTML(scheduleSearchQuery)}"
                oninput="scheduleSearchQuery = this.value; renderCurrentView()"
                placeholder="Pesquisar tema, carta ou tópico..."
                class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-roseWhite border border-rosePastel text-sm focus:outline-none focus:border-roseDark"
              />
            </div>

            <div class="lg:col-span-4">
              <select
                onchange="scheduleFilterModule = this.value; renderCurrentView()"
                class="w-full px-3.5 py-2.5 rounded-xl bg-roseWhite border border-rosePastel text-sm text-inkText focus:outline-none focus:border-roseDark"
              >
                <option value="all" ${scheduleFilterModule === 'all' ? 'selected' : ''}>Todos os Módulos (1 a 8)</option>
                ${MODULES_META.map(m => `
                  <option value="${m.id}" ${scheduleFilterModule === String(m.id) ? 'selected' : ''}>
                    ${m.code}: ${m.title}
                  </option>
                `).join('')}
              </select>
            </div>

            <div class="lg:col-span-3 flex rounded-xl bg-roseLight/70 p-1 border border-rosePastel">
              ${[
                { id: 'all', label: 'Todos' },
                { id: 'pending', label: 'Pendentes' },
                { id: 'completed', label: 'Concluídos' }
              ].map(st => `
                <button
                  onclick="scheduleFilterStatus = '${st.id}'; renderCurrentView()"
                  class="flex-1 py-1.5 text-xs font-semibold rounded-lg transition ${
                    scheduleFilterStatus === st.id
                      ? 'bg-roseDark text-roseWhite shadow-xs'
                      : 'text-roseDark hover:bg-roseWhite/60'
                  }"
                >
                  ${st.label}
                </button>
              `).join('')}
            </div>
          </div>

          ${filteredDays.length === 0 ? `
            <div class="card-surface rounded-3xl p-12 text-center">
              <p class="font-serif text-2xl text-roseDark mb-2">Nenhum dia encontrado com os filtros atuais</p>
              <button onclick="scheduleFilterModule='all'; scheduleFilterStatus='all'; scheduleSearchQuery=''; renderCurrentView()" class="mt-2 px-4 py-2 rounded-xl bg-roseLight text-roseDark text-sm font-medium">
                Limpar filtros
              </button>
            </div>
          ` : `
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
              <!-- Lista Lateral de Dias -->
              <div class="lg:col-span-5 card-surface rounded-3xl p-4 max-h-[72vh] overflow-y-auto space-y-2">
                <div class="px-2 py-1 flex items-center justify-between text-xs text-roseAntique font-semibold">
                  <span>Exibindo ${filteredDays.length} dias</span>
                  <span>Selecione para detalhar</span>
                </div>
                ${filteredDays.map(d => {
                  const isSelected = d.day === selectedScheduleDay;
                  const statusBadge = d.status === 'completed'
                    ? '<span class="px-2 py-0.5 rounded-full bg-roseDark text-roseWhite text-[10px] font-semibold">Concluído</span>'
                    : d.status === 'in_progress'
                      ? '<span class="px-2 py-0.5 rounded-full bg-rosePastel text-roseDark text-[10px] font-semibold">Em andamento</span>'
                      : '<span class="px-2 py-0.5 rounded-full bg-roseLight text-roseAntique text-[10px] font-semibold">Não iniciado</span>';

                  return `
                    <button
                      onclick="selectedScheduleDay = ${d.day}; renderCurrentView()"
                      class="w-full text-left p-3.5 rounded-2xl border transition ${
                        isSelected
                          ? 'bg-gradient-to-r from-roseLight to-rosePastel/50 border-roseDark shadow-xs'
                          : 'bg-roseWhite/80 border-roseLight hover:border-roseMedium'
                      }"
                    >
                      <div class="flex items-center justify-between gap-2 mb-1">
                        <span class="text-xs font-bold text-roseDark">
                          DIA ${String(d.day).padStart(3, '0')}
                          ${d.scheduledDate ? `<span class="font-normal text-roseAntique">• ${formatDateBR(d.scheduledDate)}</span>` : ''}
                        </span>
                        ${statusBadge}
                      </div>
                      <p class="text-sm font-semibold text-inkText line-clamp-1">${escapeHTML(d.theme)}</p>
                      <p class="text-[11px] text-inkText/65 mt-0.5">Módulo ${d.moduleId} • ${d.allTasks.length} tópicos</p>
                    </button>
                  `;
                }).join('')}
              </div>

              <!-- Painel Detalhado do Dia Selecionado -->
              ${activeDay ? `
                <div class="lg:col-span-7 card-surface rounded-3xl p-6 sm:p-7 space-y-6">
                  <!-- Navegação Anterior / Próximo -->
                  <div class="flex items-center justify-between gap-2 pb-4 border-b border-roseLight">
                    <button
                      ${currentIndexInFiltered <= 0 ? 'disabled' : ''}
                      onclick="selectedScheduleDay = ${filteredDays[currentIndexInFiltered - 1]?.day || activeDay.day}; renderCurrentView()"
                      class="px-3.5 py-2 rounded-xl bg-roseLight text-roseDark text-xs font-semibold disabled:opacity-40 hover:bg-rosePastel transition flex items-center gap-1.5"
                    >
                      <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> Dia anterior
                    </button>

                    <span class="text-xs font-semibold uppercase tracking-widest text-roseAntique">
                      Dia ${activeDay.day} de ${CURRICULUM_DAYS.length}
                    </span>

                    <button
                      ${currentIndexInFiltered >= filteredDays.length - 1 ? 'disabled' : ''}
                      onclick="selectedScheduleDay = ${filteredDays[currentIndexInFiltered + 1]?.day || activeDay.day}; renderCurrentView()"
                      class="px-3.5 py-2 rounded-xl bg-roseLight text-roseDark text-xs font-semibold disabled:opacity-40 hover:bg-rosePastel transition flex items-center gap-1.5"
                    >
                      Próximo dia <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
                    </button>
                  </div>

                  <!-- Cabeçalho do Dia -->
                  <div>
                    <div class="flex flex-wrap items-center gap-2 mb-2">
                      <span class="px-3 py-1 rounded-full bg-roseLight border border-rosePastel text-roseDark text-xs font-semibold">
                        ${activeMod?.code} — ${activeMod?.title}
                      </span>
                      ${activeDay.scheduledDate ? `
                        <span class="px-3 py-1 rounded-full bg-roseWhite border border-roseLight text-roseAntique text-xs font-medium">
                          Data: ${formatDateBR(activeDay.scheduledDate)}
                        </span>
                      ` : ''}
                      <span class="px-3 py-1 rounded-full bg-roseWhite border border-roseLight text-roseAntique text-xs font-medium">
                        ⏱ ${state.settings.dailyMinutes || activeDay.estimatedMinutes} min
                      </span>
                    </div>

                    <h3 class="text-2xl sm:text-3xl font-bold text-inkText leading-snug">
                      ${escapeHTML(activeDay.theme)}
                    </h3>

                    ${activeDay.cardRef ? `
                      <button
                        onclick="openCardModal(${activeDay.cardRef})"
                        class="mt-3 inline-flex items-center gap-2 px-3.5 py-1.5 rounded-xl bg-roseLight/80 hover:bg-rosePastel text-roseDark text-xs font-semibold border border-roseMedium/60 transition"
                      >
                        <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
                        Abrir Ficha Completa da Carta ${activeDay.cardRef}
                      </button>
                    ` : ''}
                  </div>

                  <!-- Checklist de Assuntos do Dia -->
                  <div>
                    <div class="flex items-center justify-between mb-3">
                      <h4 class="font-serif text-xl font-bold text-roseDark">Assuntos a Estudar</h4>
                      <span class="text-xs font-semibold text-roseAntique">
                        ${activeDay.allTasks.filter(t => activeDay.checkedTasks?.[t.id]).length}/${activeDay.allTasks.length} concluídos
                      </span>
                    </div>

                    <div class="space-y-2">
                      ${activeDay.allTasks.map(task => {
                        const checked = !!activeDay.checkedTasks?.[task.id];
                        return `
                          <label class="flex items-start gap-3 p-3 rounded-2xl bg-roseWhite border border-roseLight hover:border-rosePastel transition cursor-pointer">
                            <input
                              type="checkbox"
                              class="rose-checkbox mt-0.5"
                              ${checked ? 'checked' : ''}
                              onchange="toggleDayTask(${activeDay.day}, '${task.id}')"
                            />
                            <span class="text-sm leading-relaxed ${checked ? 'line-through text-inkText/50' : 'text-inkText'}">
                              ${escapeHTML(task.text)}
                            </span>
                          </label>
                        `;
                      }).join('')}
                    </div>

                    <!-- Adicionar tarefa pessoal ao dia -->
                    <form onsubmit="handleAddDayCustomTask(event, ${activeDay.day})" class="mt-3 flex gap-2">
                      <input
                        id="custom-task-day-${activeDay.day}"
                        type="text"
                        placeholder="Adicionar tópico extra de pesquisa para este dia..."
                        class="flex-1 px-3.5 py-2 rounded-xl bg-roseWhite border border-rosePastel text-xs focus:outline-none focus:border-roseDark"
                      />
                      <button type="submit" class="px-3.5 py-2 rounded-xl bg-roseLight text-roseDark text-xs font-semibold hover:bg-rosePastel transition">
                        + Adicionar
                      </button>
                    </form>
                  </div>

                  <!-- Campo de Anotações Pessoais -->
                  <div>
                    <div class="flex items-center justify-between mb-2">
                      <label class="font-serif text-xl font-bold text-roseDark">Anotações Pessoais & Fichamento</label>
                      <span class="text-[11px] text-roseAntique">Salvo automaticamente</span>
                    </div>
                    <textarea
                      rows="5"
                      oninput="updateDayNotes(${activeDay.day}, this.value)"
                      placeholder="Registre aqui suas referências bibliográficas, observações iconográficas, dúvidas para revisão e sínteses pessoais..."
                      class="w-full p-4 rounded-2xl bg-roseWhite border border-rosePastel text-sm leading-relaxed focus:outline-none focus:border-roseDark"
                    >${escapeHTML(activeDay.notes || '')}</textarea>
                  </div>

                  <!-- Botão Concluir Dia -->
                  <div class="pt-2 flex flex-wrap items-center justify-between gap-3">
                    <div class="text-xs text-inkText/70">
                      Status atual:
                      <strong class="text-roseDark">
                        ${activeDay.status === 'completed' ? 'Concluído' : activeDay.status === 'in_progress' ? 'Em andamento' : 'Não iniciado'}
                      </strong>
                    </div>

                    <button
                      onclick="markDayCompleted(${activeDay.day})"
                      class="px-6 py-3 rounded-2xl font-semibold text-sm shadow-sm transition flex items-center gap-2 ${
                        activeDay.status === 'completed'
                          ? 'bg-roseLight border border-roseDark text-roseDark hover:bg-rosePastel'
                          : 'bg-roseDark text-roseWhite hover:opacity-95'
                      }"
                    >
                      <i data-lucide="check-circle-2" class="w-4 h-4"></i>
                      ${activeDay.status === 'completed' ? 'Desmarcar conclusão do dia' : 'Concluir este dia de estudo'}
                    </button>
                  </div>
                </div>
              ` : ''}
            </div>
          `}
        </div>
      `;
    }

    function resumeLastStudiedDay() {
      scheduleFilterModule = 'all';
      scheduleFilterStatus = 'all';
      scheduleSearchQuery = '';
      selectedScheduleDay = getNextPendingDay()?.day || getLastStudiedDay();
      renderCurrentView();
      showToast(`Retomando no Dia ${selectedScheduleDay}.`);
    }

    function handleAddDayCustomTask(e, dayNum) {
      e.preventDefault();
      const inp = document.getElementById(`custom-task-day-${dayNum}`);
      if (!inp) return;
      addCustomTaskToDay(dayNum, inp.value);
    }

    // ----------------------------------------------------------------------------
    // PÁGINA 3: MÓDULOS DE ESTUDO
    // ----------------------------------------------------------------------------

    function renderModulesView() {
      return `
        <div class="space-y-6">
          <div>
            <span class="text-xs uppercase tracking-[0.2em] text-roseAntique font-semibold">Estrutura Pedagógica</span>
            <h2 class="text-3xl sm:text-4xl font-bold text-roseDark">Módulos de Estudo</h2>
            <p class="text-sm text-inkText/75 mt-1">
              Visão panorâmica dos 8 módulos progressivos da formação em Petit Lenormand.
            </p>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            ${MODULES_META.map(mod => {
              const prog = getModuleProgress(mod.id);
              const modDays = CURRICULUM_DAYS.filter(d => d.moduleId === mod.id);
              const firstDay = modDays[0]?.day || 1;
              const lastDay = modDays[modDays.length - 1]?.day || 1;

              // Amostra de tópicos principais do módulo
              const sampleTopics = mod.id === 4
                ? ["Estudo sistemático das 36 cartas em 10 categorias: Identidade, Psicologia, Aparência, Sexualidade, Amor, Espiritualidade, Saúde, Vida Material, Temporalidade e Interpretação Divinatória."]
                : modDays.flatMap(d => d.tasks.map(t => t.text)).slice(0, 6);

              return `
                <div class="card-surface rounded-3xl p-6 flex flex-col justify-between">
                  <div>
                    <div class="flex items-center justify-between gap-2 mb-2">
                      <span class="px-3 py-1 rounded-full bg-roseLight border border-rosePastel text-roseDark text-xs font-bold tracking-wider">
                        ${mod.code}
                      </span>
                      <span class="text-xs font-semibold text-roseAntique">
                        Dias ${firstDay} a ${lastDay} (${modDays.length} dias)
                      </span>
                    </div>

                    <h3 class="text-2xl font-bold text-inkText mt-2">${mod.title}</h3>
                    <p class="text-xs text-inkText/75 mt-1 leading-relaxed">${mod.subtitle}</p>

                    <!-- Barra de Progresso -->
                    <div class="mt-4 mb-5">
                      <div class="flex items-center justify-between text-xs font-semibold mb-1.5">
                        <span class="text-roseDark">${prog.completed} de ${prog.total} dias concluídos</span>
                        <span class="text-roseDark">${prog.percent}%</span>
                      </div>
                      <div class="w-full h-2 bg-roseLight rounded-full overflow-hidden">
                        <div class="h-full bg-gradient-to-r from-roseAntique to-roseDark rounded-full transition-all duration-500" style="width: ${prog.percent}%"></div>
                      </div>
                    </div>

                    <!-- Ementa resumida -->
                    <div class="bg-roseWhite/90 rounded-2xl p-4 border border-roseLight space-y-1.5">
                      <p class="text-[11px] font-semibold uppercase tracking-wider text-roseAntique mb-1">Ementa do Módulo:</p>
                      ${sampleTopics.map(t => `
                        <div class="text-xs text-inkText/85 flex items-start gap-2">
                          <span class="text-roseDark mt-0.5">✦</span>
                          <span>${escapeHTML(t)}</span>
                        </div>
                      `).join('')}
                      ${mod.id !== 4 && modDays.flatMap(d => d.tasks).length > 6 ? `
                        <p class="text-[11px] text-roseAntique italic pt-1">+ outros tópicos detalhados no cronograma...</p>
                      ` : ''}
                    </div>
                  </div>

                  <div class="mt-5 pt-4 border-t border-roseLight flex items-center justify-between">
                    <span class="text-xs font-medium text-inkText/70">
                      Status: <strong class="text-roseDark">${prog.percent === 100 ? 'Concluído' : prog.percent > 0 ? 'Em andamento' : 'Não iniciado'}</strong>
                    </span>
                    <button
                      onclick="navigateTo('schedule', { moduleId: ${mod.id}, dayNum: ${firstDay} })"
                      class="px-4 py-2 rounded-xl bg-roseLight hover:bg-rosePastel text-roseDark text-xs font-semibold transition flex items-center gap-1.5"
                    >
                      Estudar Módulo <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
                    </button>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    // ----------------------------------------------------------------------------
    // PÁGINA 4: ENCICLOPÉDIA DAS 36 CARTAS
    // ----------------------------------------------------------------------------
    let encyclopediaSearch = '';
    let encyclopediaStatusFilter = 'all';

    function renderEncyclopediaView() {
      const cardsFiltered = LENORMAND_CARDS.filter(c => {
        const prog = getCardProgress(c.num);
        if (encyclopediaStatusFilter === 'completed' && prog.percent < 100) return false;
        if (encyclopediaStatusFilter === 'in_progress' && (prog.percent === 0 || prog.percent === 100)) return false;
        if (encyclopediaStatusFilter === 'not_started' && prog.percent > 0) return false;

        if (encyclopediaSearch.trim() !== '') {
          const q = encyclopediaSearch.toLowerCase();
          if (!c.name.toLowerCase().includes(q) && !String(c.num).includes(q) && !c.suit.toLowerCase().includes(q)) {
            return false;
          }
        }
        return true;
      });

      return `
        <div class="space-y-6">
          <div class="flex flex-col md:flex-row md:items-end justify-between gap-4">
            <div>
              <span class="text-xs uppercase tracking-[0.2em] text-roseAntique font-semibold">Fichamento Sistemático</span>
              <h2 class="text-3xl sm:text-4xl font-bold text-roseDark">Enciclopédia das 36 Cartas</h2>
              <p class="text-sm text-inkText/75 mt-1">
                Clique em qualquer lâmina para abrir sua ficha acadêmica com os 10 eixos de pesquisa e checklist individual.
              </p>
            </div>
          </div>

          <!-- Busca e Filtros -->
          <div class="card-surface rounded-2xl p-4 flex flex-col sm:flex-row gap-3">
            <div class="relative flex-1">
              <i data-lucide="search" class="w-4 h-4 text-roseAntique absolute left-3.5 top-3.5"></i>
              <input
                type="text"
                value="${escapeHTML(encyclopediaSearch)}"
                oninput="encyclopediaSearch = this.value; renderCurrentView()"
                placeholder="Buscar carta por número, nome ou naipe..."
                class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-roseWhite border border-rosePastel text-sm focus:outline-none focus:border-roseDark"
              />
            </div>

            <select
              onchange="encyclopediaStatusFilter = this.value; renderCurrentView()"
              class="px-4 py-2.5 rounded-xl bg-roseWhite border border-rosePastel text-sm text-inkText focus:outline-none focus:border-roseDark"
            >
              <option value="all" ${encyclopediaStatusFilter === 'all' ? 'selected' : ''}>Todas as 36 cartas</option>
              <option value="not_started" ${encyclopediaStatusFilter === 'not_started' ? 'selected' : ''}>Não iniciadas</option>
              <option value="in_progress" ${encyclopediaStatusFilter === 'in_progress' ? 'selected' : ''}>Em estudo</option>
              <option value="completed" ${encyclopediaStatusFilter === 'completed' ? 'selected' : ''}>Concluídas (100%)</option>
            </select>
          </div>

          <!-- Grade das 36 Cartas -->
          <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4">
            ${cardsFiltered.map(card => {
              const prog = getCardProgress(card.num);
              return `
                <button
                  onclick="openCardModal(${card.num})"
                  class="card-surface rounded-2xl p-4 text-left flex flex-col justify-between group hover:-translate-y-1 hover:shadow-card transition-all relative overflow-hidden"
                >
                  <div>
                    <div class="flex items-center justify-between text-xs font-bold text-roseDark mb-2">
                      <span class="px-2 py-0.5 rounded-md bg-roseLight border border-rosePastel">
                        ${String(card.num).padStart(2, '0')}
                      </span>
                      <span class="text-[10px] font-medium text-roseAntique">${card.suit}</span>
                    </div>

                    <!-- Área ilustrativa / imagem personalizada -->
                    <div class="w-full aspect-[3/4] rounded-xl bg-gradient-to-b from-roseWhite to-roseLight/80 border border-rosePastel/80 flex flex-col items-center justify-center mb-3 overflow-hidden relative">
                      ${prog.customImage ? `
                        <img src="${prog.customImage}" alt="${escapeHTML(card.name)}" class="w-full h-full object-cover" />
                      ` : `
                        <div class="p-3 rounded-full bg-roseWhite/90 border border-rosePastel group-hover:scale-110 transition-transform">
                          ${getCardGeometricSVG(card.num)}
                        </div>
                        <span class="text-[10px] text-roseAntique/80 mt-2 font-medium">Lâmina ${card.num}</span>
                      `}
                    </div>

                    <h3 class="font-serif text-lg font-bold text-inkText leading-tight group-hover:text-roseDark transition">
                      ${escapeHTML(card.name)}
                    </h3>
                  </div>

                  <div class="mt-3 pt-2.5 border-t border-roseLight">
                    <div class="flex items-center justify-between text-[11px] font-semibold mb-1">
                      <span class="text-roseAntique">${prog.status}</span>
                      <span class="text-roseDark">${prog.percent}%</span>
                    </div>
                    <div class="w-full h-1.5 bg-roseLight rounded-full overflow-hidden">
                      <div class="h-full bg-roseDark rounded-full transition-all" style="width: ${prog.percent}%"></div>
                    </div>
                  </div>
                </button>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    // Modal da Ficha Individual da Carta (10 categorias completas)
    function openCardModal(cardNum) {
      const card = LENORMAND_CARDS.find(c => c.num === cardNum);
      if (!card) return;
      const prog = getCardProgress(cardNum);

      const overlay = document.getElementById('modal-overlay');
      const content = document.getElementById('modal-content');

      content.innerHTML = `
        <!-- Cabeçalho Fixo do Modal -->
        <div class="p-5 sm:p-6 bg-gradient-to-r from-roseLight/90 to-rosePastel/50 border-b border-rosePastel flex items-center justify-between gap-4">
          <div class="flex items-center gap-3.5">
            <div class="w-12 h-12 rounded-2xl bg-roseWhite border border-roseMedium flex items-center justify-center font-serif text-2xl font-bold text-roseDark shadow-xs">
              ${String(card.num).padStart(2, '0')}
            </div>
            <div>
              <div class="flex flex-wrap items-center gap-2 text-xs text-roseAntique font-semibold">
                <span>${card.suit}</span>
                <span>•</span>
                <span>Elemento: ${card.element}</span>

    function closeModal() {
      const overlay = document.getElementById('modal-overlay');

    function updateCardNotes(cardNum, text) {
      if (!state.cardsProgress[cardNum]) {
        state.cardsProgress[cardNum] = { checkedTopics: {}, notes: '', customImage: '' };
      }
      state.cardsProgress[cardNum].notes = text;
      saveState();
    }

    function handleCardImageUpload(e, cardNum) {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        // Redimensionar imagem para economizar localStorage
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const maxW = 320;
          const scale = Math.min(1, maxW / img.width);
          canvas.width = img.width * scale;
          canvas.height = img.height * scale;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          const dataUrl = canvas.toDataURL('image/jpeg', 0.82);

          if (!state.cardsProgress[cardNum]) {
            state.cardsProgress[cardNum] = { checkedTopics: {}, notes: '', customImage: '' };
          }
          state.cardsProgress[cardNum].customImage = dataUrl;
          saveState();
          openCardModal(cardNum);
          renderCurrentView();
          showToast("Imagem da carta salva no seu planner!");
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    }

    function removeCardImage(cardNum) {
      if (state.cardsProgress[cardNum]) {
        state.cardsProgress[cardNum].customImage = '';
        saveState();
        openCardModal(cardNum);
        renderCurrentView();
      }
    }

    function toggleRevisionItem(bucket, chkId) {
      if (!state.revisionChecks[bucket]) state.revisionChecks[bucket] = {};
      state.revisionChecks[bucket][chkId] = !state.revisionChecks[bucket][chkId];
      saveState();
      renderCurrentView();
    }

    function completeRevisionSession(bucket, label, count) {
      state.revisionsHistory.unshift({
        id: `rev_${Date.now()}`,
        date: getTodayISO(),
        type: bucket,
        label,
        itemsCount: count
      });
      state.revisionChecks[bucket] = {};
      recordActivityToday();
      saveState();
      renderCurrentView();
      showToast(`${label} registrada no histórico!`);
    }

            <div class="card-surface rounded-2xl p-4">
              <span class="text-[11px] font-semibold uppercase text-roseAntique">Horas Registradas</span>
              <p class="text-2xl font-serif font-bold text-roseDark mt-1">${stats.studiedHours}h</p>
            </div>
            <div class="card-surface rounded-2xl p-4">
              <span class="text-[11px] font-semibold uppercase text-roseAntique">Sequência</span>
              <p class="text-2xl font-serif font-bold text-inkText mt-1">${stats.streak}d</p>
            </div>
            <div class="card-surface rounded-2xl p-4">
              <span class="text-[11px] font-semibold uppercase text-roseAntique">Combinações</span>
              <p class="text-2xl font-serif font-bold text-roseDark mt-1">${stats.completedCombos}/630</p>
            </div>
          </div>

          <!-- Progresso por Módulo & Gráfico Mensal -->
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div class="lg:col-span-7 card-surface rounded-3xl p-6">
              <h3 class="text-2xl font-bold text-roseDark mb-4">Progresso por Módulo</h3>
              <div class="space-y-4">
                ${MODULES_META.map(mod => {
                  const mp = getModuleProgress(mod.id);
                  return `
                    <div>
                      <div class="flex justify-between text-xs font-semibold mb-1">
                        <span class="text-inkText">${mod.code} — ${mod.title}</span>
                        <span class="text-roseDark">${mp.completed}/${mp.total} (${mp.percent}%)</span>
                      </div>
                      <div class="w-full h-2.5 bg-roseLight rounded-full overflow-hidden">
                        <div class="h-full bg-gradient-to-r from-roseMedium via-roseAntique to-roseDark rounded-full transition-all duration-500" style="width: ${mp.percent}%"></div>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>

            <div class="lg:col-span-5 card-surface rounded-3xl p-6 flex flex-col justify-between">
              <div>
                <h3 class="text-2xl font-bold text-roseDark mb-1">Histórico Mensal</h3>
                <p class="text-xs text-inkText/70 mb-6">Dias ativos de estudo nos últimos 6 meses</p>

                <div class="h-48 flex items-end justify-between gap-3 pt-4 px-2 border-b border-rosePastel">
                  ${monthlyBars.map(m => {
                    const heightPct = Math.max(8, Math.round((m.count / maxMonthly) * 100));
                    return `
                      <div class="flex-1 flex flex-col items-center gap-2 h-full justify-end">
                        <span class="text-xs font-bold text-roseDark">${m.count}</span>
                        <div class="w-full max-w-[38px] rounded-t-xl bg-gradient-to-t from-roseAntique to-rosePastel transition-all duration-500" style="height: ${heightPct}%"></div>
                      </div>
                    `;
                  }).join('')}
                </div>
                <div class="flex justify-between gap-3 px-2 pt-2">
                  ${monthlyBars.map(m => `
                    <div class="flex-1 text-center text-xs font-semibold text-roseAntique capitalize">${m.label}</div>
                  `).join('')}
                </div>
              </div>

              <div class="mt-6 p-3.5 rounded-2xl bg-roseLight/60 border border-rosePastel text-xs text-inkText/80">
                Total de dias com registro de atividade: <strong class="text-roseDark">${state.activityDates.length}</strong>
              </div>
            </div>
          </div>

          <!-- Progresso Individual das 36 Cartas -->
          <div class="card-surface rounded-3xl p-6">
            <div class="flex items-center justify-between mb-4">
              <div>
                <h3 class="text-2xl font-bold text-roseDark">Progresso por Carta (36 Lâminas)</h3>
                <p class="text-xs text-inkText/70">Percentual de tópicos pesquisados em cada ficha individual</p>
              </div>
            </div>

            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-3">
              ${LENORMAND_CARDS.map(c => {
                const cp = getCardProgress(c.num);
                return `
                  <button
                    onclick="openCardModal(${c.num})"
                    class="p-3 rounded-2xl bg-roseWhite border border-roseLight hover:border-roseMedium text-left transition"
                  >
                    <div class="flex justify-between text-xs font-bold mb-1">
                      <span class="text-roseDark">${String(c.num).padStart(2, '0')}</span>
                      <span class="text-roseAntique">${cp.percent}%</span>
                    </div>
                    <p class="text-xs font-semibold text-inkText truncate mb-1.5">${escapeHTML(c.name)}</p>
                    <div class="w-full h-1.5 bg-roseLight rounded-full overflow-hidden">
                      <div class="h-full bg-roseDark rounded-full" style="width: ${cp.percent}%"></div>
                    </div>
                  </button>
                `;
              }).join('')}
            </div>
          </div>
        </div>
      `;
    }

    // ----------------------------------------------------------------------------
    // PÁGINA 8: CONFIGURAÇÕES & EXPORTAÇÃO GITHUB PAGES
    // ----------------------------------------------------------------------------

    function renderSettingsView() {
      return `
        <div class="space-y-6">
          <div class="flex flex-col md:flex-row md:items-end justify-between gap-4">
            <div>
              <span class="text-xs uppercase tracking-[0.2em] text-roseAntique font-semibold">Personalização & Deploy</span>
              <h2 class="text-3xl sm:text-4xl font-bold text-roseDark">Configurações do Planner</h2>
              <p class="text-sm text-inkText/75 mt-1">
                Ajuste seu cronograma, gerencie backups locais e acesse os arquivos de publicação no GitHub Pages.
              </p>
            </div>

            <button
              onclick="openGitHubPagesModal()"
              class="self-start md:self-auto px-4 py-2.5 rounded-xl bg-roseDark text-roseWhite text-sm font-semibold shadow-sm hover:opacity-95 transition flex items-center gap-2"
            >
              <i data-lucide="github" class="w-4 h-4"></i>
              Guia & Arquivos GitHub Pages
            </button>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <!-- Parâmetros de Estudo -->
            <form onsubmit="saveSettingsForm(event)" class="card-surface rounded-3xl p-6 space-y-4">
              <h3 class="text-2xl font-bold text-roseDark">Parâmetros da Formação</h3>

              <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-roseAntique mb-1">
                  Nome da Estudante
                </label>
                <input
                  id="cfg-name"
                  type="text"
                  value="${escapeHTML(state.settings.studentName)}"
                  class="w-full px-4 py-2.5 rounded-xl bg-roseWhite border border-rosePastel text-sm focus:outline-none focus:border-roseDark"
                />
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label class="block text-xs font-semibold uppercase tracking-wider text-roseAntique mb-1">
                    Data de Início do Cronograma
                  </label>
                  <input
                    id="cfg-start-date"
                    type="date"
                    value="${state.settings.startDate || ''}"
                    class="w-full px-4 py-2.5 rounded-xl bg-roseWhite border border-rosePastel text-sm focus:outline-none focus:border-roseDark"
                  />
                </div>

                <div>
                  <label class="block text-xs font-semibold uppercase tracking-wider text-roseAntique mb-1">
                    Tempo Diário Disponível (min)
                  </label>
                  <input
                    id="cfg-daily-minutes"
                    type="number"
                    min="15"
                    max="480"
                    step="5"
                    value="${state.settings.dailyMinutes}"
                    class="w-full px-4 py-2.5 rounded-xl bg-roseWhite border border-rosePastel text-sm focus:outline-none focus:border-roseDark"
                  />
                </div>
              </div>

              <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-roseAntique mb-1">
                  Meta de Duração Total (dias)
                </label>
                <input
                  id="cfg-duration"
                  type="number"
                  min="30"
                  max="730"
                  value="${state.settings.scheduleDurationTarget || CURRICULUM_DAYS.length}"
                  class="w-full px-4 py-2.5 rounded-xl bg-roseWhite border border-rosePastel text-sm focus:outline-none focus:border-roseDark"
                />
                <p class="text-[11px] text-inkText/65 mt-1">
                  Currículo base possui ${CURRICULUM_DAYS.length} dias estruturados.
                </p>
              </div>

              <div class="pt-2">
                <button type="submit" class="px-5 py-2.5 rounded-xl bg-roseDark text-roseWhite text-sm font-semibold hover:opacity-95 transition">
                  Salvar Configurações
                </button>
              </div>
            </form>

            <!-- Controle de Fluxo e Backup -->
            <div class="card-surface rounded-3xl p-6 flex flex-col justify-between space-y-6">
              <div class="space-y-4">
                <h3 class="text-2xl font-bold text-roseDark">Controle de Ritmo & Dados</h3>

                <div class="p-4 rounded-2xl bg-roseWhite border border-roseLight flex items-center justify-between gap-4">
                  <div>
                    <p class="text-sm font-semibold text-inkText">
                      ${state.settings.isPaused ? 'Estudos atualmente pausados' : 'Cronograma em andamento'}
                    </p>
                    <p class="text-xs text-inkText/70">
                      Pause quando precisar fazer uma interrupção sem perder sua sequência.
                    </p>
                  </div>
                  <button
                    onclick="togglePauseStudies()"
                    class="px-4 py-2 rounded-xl text-xs font-semibold shrink-0 transition ${
                      state.settings.isPaused
                        ? 'bg-roseDark text-roseWhite'
                        : 'bg-roseLight text-roseDark border border-roseMedium'
                    }"
                  >
                    ${state.settings.isPaused ? 'Retomar' : 'Pausar Estudos'}
                  </button>
                </div>

                <div class="p-4 rounded-2xl bg-roseWhite border border-roseLight flex items-center justify-between gap-4">
                  <div>
                    <p class="text-sm font-semibold text-inkText">Reorganizar dias pendentes</p>
                    <p class="text-xs text-inkText/70">
                      Recalcula a data de início para que o próximo dia pendente caia na data de hoje.
                    </p>
                  </div>
                  <button
                    onclick="reorganizePendingDaysFromToday()"
                    class="px-4 py-2 rounded-xl bg-roseLight hover:bg-rosePastel text-roseDark text-xs font-semibold shrink-0 transition"
                  >
                    Reorganizar
                  </button>
                </div>
              </div>

              <!-- Exportar / Importar JSON -->
              <div class="pt-4 border-t border-roseLight space-y-3">
                <p class="text-xs font-semibold uppercase tracking-wider text-roseAntique">Backup Local (JSON)</p>
                <div class="flex flex-wrap gap-2.5">
                  <button
                    onclick="exportBackupJSON()"
                    class="px-4 py-2 rounded-xl bg-roseLight border border-roseMedium text-roseDark text-xs font-semibold hover:bg-rosePastel transition flex items-center gap-1.5"
                  >
                    <i data-lucide="download" class="w-3.5 h-3.5"></i> Exportar Progresso
                  </button>

                  <label class="px-4 py-2 rounded-xl bg-roseWhite border border-rosePastel text-inkText text-xs font-semibold hover:bg-roseLight transition cursor-pointer flex items-center gap-1.5">
                    <i data-lucide="upload" class="w-3.5 h-3.5"></i> Importar Backup
                    <input type="file" accept=".json" class="hidden" onchange="importBackupJSON(event)" />
                  </label>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function saveSettingsForm(e) {
      e.preventDefault();
      state.settings.studentName = document.getElementById('cfg-name').value.trim() || "Estudante de Lenormand";
      state.settings.startDate = document.getElementById('cfg-start-date').value || getTodayISO();
      state.settings.dailyMinutes = Number(document.getElementById('cfg-daily-minutes').value) || 60;
      state.settings.scheduleDurationTarget = Number(document.getElementById('cfg-duration').value) || CURRICULUM_DAYS.length;
      saveState();
      renderCurrentView();
      showToast("Configurações salvas com sucesso!");
    }

    function togglePauseStudies() {
      state.settings.isPaused = !state.settings.isPaused;
      state.settings.pausedAt = state.settings.isPaused ? getTodayISO() : null;
      saveState();
      renderCurrentView();
      showToast(state.settings.isPaused ? "Estudos pausados." : "Estudos retomados!");
    }

    function reorganizePendingDaysFromToday() {
      const nextPending = getNextPendingDay();
      if (!nextPending) return;
      const today = getTodayISO();
      state.settings.startDate = addDaysToISO(today, -(nextPending.day - 1));
      state.settings.isPaused = false;
      saveState();
      renderCurrentView();
      showToast(`Cronograma reorganizado! O Dia ${nextPending.day} agora está agendado para hoje.`);
    }

    function exportBackupJSON() {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `lenormand-study-backup-${getTodayISO()}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast("Backup JSON exportado!");
    }

    function importBackupJSON(e) {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const parsed = JSON.parse(evt.target.result);
          if (parsed && parsed.settings && parsed.daysProgress) {
            state = { ...structuredClone(defaultState), ...parsed };
            saveState();
            renderCurrentView();
            showToast("Backup restaurado com sucesso!");
          } else {
            showToast("Arquivo JSON inválido.", "warning");
          }
        } catch {
          showToast("Erro ao ler o arquivo JSON.", "warning");
        }
      };
      reader.readAsText(file);
    }

    // Modal com README.md, estrutura e GitHub Actions para GitHub Pages
    function openGitHubPagesModal() {
      const overlay = document.getElementById('modal-overlay');
      const content = document.getElementById('modal-content');

      const readmeText = `# Lenormand Study — Planner de Estudos (Petit Lenormand)

Planner acadêmico estático para organização de estudos aprofundados de Baralho Cigano (Petit Lenormand), com currículo estruturado em 8 módulos, fichas individuais das 36 cartas, matriz das 630 combinações, sistema de revisões espaçadas e persistência local (\`localStorage\`).

## Publicação no GitHub Pages
1. Crie um repositório no GitHub (ex.: \`lenormand-study\`).
2. Adicione o arquivo \`index.html\` na raiz do repositório e o workflow \`.github/workflows/deploy.yml\`.
3. Em **Settings > Pages > Build and deployment**, selecione **GitHub Actions**.
4. A cada push na branch \`main\`, o site será publicado automaticamente.`;

      const workflowText = `name: Deploy Lenormand Study to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: \${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4`;

      content.innerHTML = `
        <div class="p-5 sm:p-6 bg-roseLight/80 border-b border-rosePastel flex items-center justify-between">
          <div>
            <span class="text-xs font-bold uppercase tracking-widest text-roseAntique">Deploy Estático</span>
            <h3 class="text-2xl font-bold text-roseDark">Publicação no GitHub Pages</h3>
          </div>
          <button onclick="closeModal()" class="p-2 rounded-xl bg-roseWhite text-roseDark border border-rosePastel">
            <i data-lucide="x" class="w-5 h-5"></i>
          </button>
        </div>

        <div class="p-5 sm:p-6 overflow-y-auto space-y-5 text-xs">
          <div>
            <h4 class="font-serif text-lg font-bold text-roseDark mb-1">Estrutura Recomendada do Repositório</h4>
            <pre class="p-3.5 rounded-2xl bg-roseWhite border border-rosePastel text-inkText overflow-x-auto">lenormand-study/
├── index.html
├── README.md
└── .github/
    └── workflows/
        └── deploy.yml</pre>
          </div>

          <div>
            <div class="flex items-center justify-between mb-1">
              <h4 class="font-serif text-lg font-bold text-roseDark">README.md</h4>
              <button onclick="copyTextToClipboard(\`${readmeText.replace(/`/g, '\\`')}\`)" class="px-2.5 py-1 rounded-lg bg-roseLight text-roseDark font-semibold">Copiar</button>
            </div>
            <pre class="p-3.5 rounded-2xl bg-roseWhite border border-rosePastel text-inkText overflow-x-auto whitespace-pre-wrap">${escapeHTML(readmeText)}</pre>
          </div>

          <div>
            <div class="flex items-center justify-between mb-1">
              <h4 class="font-serif text-lg font-bold text-roseDark">.github/workflows/deploy.yml</h4>
              <button onclick="copyTextToClipboard(\`${workflowText.replace(/`/g, '\\`')}\`)" class="px-2.5 py-1 rounded-lg bg-roseLight text-roseDark font-semibold">Copiar</button>
            </div>
            <pre class="p-3.5 rounded-2xl bg-roseWhite border border-rosePastel text-inkText overflow-x-auto whitespace-pre-wrap">${escapeHTML(workflowText)}</pre>
          </div>
        </div>
      `;

      overlay.classList.remove('hidden');
      overlay.classList.add('flex');
      lucide.createIcons();
    }

    function copyTextToClipboard(text) {
      navigator.clipboard.writeText(text).then(() => {
        showToast("Conteúdo copiado para a área de transferência!");
      });
    }

    // ----------------------------------------------------------------------------
    // 7. SANITIZAÇÃO & INICIALIZAÇÃO
    // ----------------------------------------------------------------------------

    function escapeHTML(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    window.onload = function() {
      // Eventos do menu mobile
      const mobileBtn = document.getElementById('mobile-menu-btn');
      const closeBtn = document.getElementById('close-sidebar-btn');
      const backdrop = document.getElementById('mobile-backdrop');
      const sidebar = document.getElementById('sidebar');

      const openDrawer = () => {
        sidebar.classList.remove('-translate-x-full');
        backdrop.classList.remove('hidden');
      };
      const closeDrawer = () => {
        sidebar.classList.add('-translate-x-full');
        backdrop.classList.add('hidden');
      };

      if (mobileBtn) mobileBtn.addEventListener('click', openDrawer);
      if (closeBtn) closeBtn.addEventListener('click', closeDrawer);
      if (backdrop) backdrop.addEventListener('click', closeDrawer);

      // Fechar modal clicando fora
      const modalOverlay = document.getElementById('modal-overlay');
      modalOverlay.addEventListener('click', (e) => {
        if (e.target === modalOverlay) closeModal();
      });

      renderNavigation();
      renderCurrentView();
    };
  </script>
</body>
</html>
